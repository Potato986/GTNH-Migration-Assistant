name: Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v0.1']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build portable EXE and verify embedded script
        run: .\Build-Portable.ps1

      - name: Test migration and backup recovery
        run: |
          $exe = (Resolve-Path 'dist/GTNH-Migration-Assistant-v0.1-Windows.exe').Path
          $before = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          .\tests\Test-Portable.ps1 -ExePath $exe
          $after = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'The executable changed during testing.' }
          "$after  $([IO.Path]::GetFileName($exe))" |
            Set-Content -LiteralPath "$exe.sha256" -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/GTNH-Migration-Assistant-v0.1-Windows.exe
            dist/GTNH-Migration-Assistant-v0.1-Windows.exe.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist

      - name: Verify and publish tested files
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check GTNH-Migration-Assistant-v0.1-Windows.exe.sha256
          gh release create "$GITHUB_REF_NAME" *.exe *.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "GTNH 迁移助手 v0.1 测试版" \
            --notes "Windows 用户请下载 EXE，双击后选择旧实例和新实例。"
